<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>安全第一むじなグループ｜荒野行動アカウント販売・買取</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #033b5c;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 100;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 15px;
    }

    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #033b5c;
      font-size: 14px;
    }

    .hero {
      margin-top: 64px;
      min-height: 70vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("hero.jpg"); /* ←差し替え */
      background-size: cover;
      background-position: center;
      filter: brightness(0.75);
    }

    .hero-title {
      font-size: 40px;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .hero-sub {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .hero-cta {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 12px 32px;
      border-radius: 999px;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      padding: 60px 8vw 80px;
      background: #f3f9fc;
    }

    .section-title {
      text-align: center;
      font-size: 22px;
      letter-spacing: 0.15em;
      margin-bottom: 32px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 18px 20px;
    }

    .card-label {
      font-size: 12px;
      color: #0a7ac4;
      letter-spacing: 0.15em;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .news-list {
      max-width: 720px;
      margin: 0 auto 60px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      padding: 20px 24px;
    }

    .news-item {
      padding: 10px 0;
      border-bottom: 1px solid #e3edf3;
      font-size: 13px;
    }

    .video-placeholder {
      max-width: 720px;
      margin: 0 auto 60px;
      padding: 24px;
      border-radius: 16px;
      border: 1px dashed #b7c9d6;
      background: #f7fbfe;
      text-align: center;
      font-size: 13px;
      color: #6b7c88;
    }

    .cta-bottom {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      padding: 40px 24px;
      border-radius: 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .cta-bottom::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("cta.jpg"); /* ←差し替え */
      background-size: cover;
      background-position: center;
      filter: brightness(0.7);
    }
