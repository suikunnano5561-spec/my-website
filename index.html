<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>むじなグループ</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:300vh;
  overflow-x:hidden;
}

/* 背景動画 */
video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* 薄いフィルター */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(180,220,255,.15);
  z-index:-1;
}

/* 流れる帯 */
.track{
  position:absolute;
  left:0;
  top:100vh;

  width:100%;

  animation:scrollUp 25s linear infinite;
}

.item{
  margin:120px auto;
  text-align:center;
}

/* 文字 */
.title{
  font-size:48px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 20px rgba(0,0,0,.4);
}

/* 画像 */
.item img{
  width:260px;
  border-radius:15px;
  margin-top:20px;
}

@keyframes scrollUp{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-250vh);
  }

}

</style>
</head>
<body>

<video autoplay muted loop playsinline>
  805983194.841036.mp4
</video>

<div class="overlay"></div>

<div class="track">

  <div class="item">
    <div class="title">
      安全性第1むじなグループ
    </div>
  </div>

  <div class="item">
    stock.png
  </div>

  <div class="item">
    <div class="title">
      在庫詳細
    </div>
  </div>

  <div class="item">
    line.png
  </div>

  <div class="item">
    <div class="title">
      公式LINE
    </div>
  </div>

</div>

</body>
</html>
